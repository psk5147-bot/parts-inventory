<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="icon.png">
<link rel="apple-touch-icon-precomposed" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="재고 관리">
<title>재고 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1a1a;font-size:14px}
.app{max-width:1100px;margin:0 auto;padding:20px 16px}
h1{font-size:18px;font-weight:600;color:#111}
.tabs{display:flex;border-bottom:1px solid #e0e0e0;margin-bottom:20px;background:#fff;border-radius:10px 10px 0 0;padding:0 8px}
.tab{padding:12px 18px;font-size:13px;cursor:pointer;border:none;background:none;color:#888;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab.on{color:#111;border-bottom:2px solid #111}
.sec{display:none}.sec.on{display:block}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
input[type=text],input[type=email],input[type=password],select{font-size:13px;padding:7px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#111;outline:none}
input:focus,select:focus{border-color:#888}
.btn{padding:7px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#111;font-size:13px;cursor:pointer;font-weight:500}
.btn:hover{background:#f0f0f0}
.btn-p{background:#111;color:#fff;border-color:#111}
.btn-p:hover{background:#333}
.btn-d{color:#c0392b;border-color:#ddd}
.btn-d:hover{background:#fff5f5}

/* 로그인 화면 */
.login-wrap{max-width:360px;margin:80px auto;background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 24px rgba(0,0,0,.1)}
.login-wrap h2{font-size:20px;font-weight:700;margin-bottom:6px;text-align:center}
.login-sub{font-size:13px;color:#888;text-align:center;margin-bottom:24px}
.login-form{display:flex;flex-direction:column;gap:10px}
.login-form input{font-size:14px;padding:10px 12px;border:1px solid #ddd;border-radius:8px;width:100%}
.login-form .btn-p{padding:10px;font-size:14px;border-radius:8px;width:100%}
.login-err{color:#c0392b;font-size:12px;text-align:center;min-height:18px}

/* 빠른재고 3열 */
.quick-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;height:calc(100vh - 210px)}
.col-box{background:#fff;border:1px solid #e8e8e8;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.col-hd{padding:10px 16px;font-size:12px;font-weight:700;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:6px;background:#fff;flex-shrink:0}
.col-body{flex:1;overflow-y:auto;padding:8px;min-height:0}
.col-body::-webkit-scrollbar{width:4px}
.col-body::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}

.prow{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border:1px solid #eee;border-radius:10px;margin-bottom:6px;transition:border-color .15s}
.prow:hover{border-color:#bbb}
.prow.low{border-left:3px solid #f39c12}
.prow.out{border-left:3px solid #e74c3c}
.pinfo{flex:1;min-width:0}
.pname{font-size:13px;font-weight:600;color:#111;word-break:keep-all;white-space:normal}
.pmeta{font-size:11px;color:#888;margin-top:1px}
.stock-ctrl{display:flex;align-items:center;border:1px solid #ddd;border-radius:8px;overflow:hidden;flex-shrink:0}
.scbtn{width:30px;height:30px;border:none;background:#f5f5f3;color:#111;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.scbtn:hover{background:#e8e8e8}
.scbtn:active{background:#ddd}
.scval{width:38px;text-align:center;font-size:13px;font-weight:700;padding:0;border:none;outline:none;background:#fff;color:#111}
.edit-sm{font-size:11px;color:#bbb;cursor:pointer;padding:4px 6px;border:1px solid transparent;border-radius:5px;flex-shrink:0}
.edit-sm:hover{border-color:#ddd;color:#555}
.action-feed{font-size:11px;padding:3px 8px;border-radius:5px;font-weight:500;opacity:0;transition:opacity .3s;white-space:nowrap;flex-shrink:0;min-width:60px;text-align:center}
.action-feed.show{opacity:1}
.action-feed.sale{background:#FFEBEE;color:#C62828}
.action-feed.restock{background:#E8F5E9;color:#2E7D32}

.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
.b-ok{background:#E8F5E9;color:#2E7D32}
.b-low{background:#FFF8E1;color:#E65100}
.b-out{background:#FFEBEE;color:#C62828}
.b-gray{background:#f0f0f0;color:#666}
.b-blue{background:#EBF5FF;color:#1565C0}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.mcard{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:14px 16px}
.mcard-l{font-size:11px;color:#888;margin-bottom:4px}
.mcard-v{font-size:22px;font-weight:700;color:#111}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:16px;margin-bottom:12px}
.card-hd{font-size:11px;font-weight:600;color:#888;letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid #e8e8e8;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;color:#888;border-bottom:1px solid #eee;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #eee;color:#111}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #eee;font-size:13px}
.hist-row:last-child{border-bottom:none}

/* 모달 */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:420px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-hd{font-size:15px;font-weight:700;margin-bottom:16px}
.mform{display:flex;flex-direction:column;gap:10px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;color:#888;font-weight:500}
.fg input,.fg select{font-size:13px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#111;width:100%;outline:none}
.fg input:focus,.fg select:focus{border-color:#888}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modal-ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

/* 확인 팝업 */
.confirm-modal{background:#fff;border-radius:14px;padding:24px;width:300px;max-width:92vw;box-shadow:0 8px 32px rgba(0,0,0,.2);text-align:center}
.confirm-title{font-size:15px;font-weight:700;margin-bottom:8px}
.confirm-msg{font-size:13px;color:#555;margin-bottom:20px;line-height:1.5}
.confirm-btns{display:flex;gap:8px;justify-content:center}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1}
.bar-o{height:6px;background:#eee;border-radius:3px;margin-top:4px}
.bar-i{height:6px;border-radius:3px}
.rank-row{padding:6px 0;font-size:13px;border-bottom:1px solid #eee}
.rank-row:last-child{border-bottom:none}
.empty{color:#aaa;font-size:13px;padding:8px 0}
.spinner{width:18px;height:18px;border:2px solid #eee;border-top-color:#111;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-badge{font-size:11px;display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#2E7D32;display:inline-block}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.user-badge{font-size:12px;background:#f0f0f0;padding:4px 10px;border-radius:20px;color:#555;display:flex;align-items:center;gap:6px}
.notif-btn{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #ddd;background:#fff;cursor:pointer;color:#555}
.alert-banner{background:#FFEBEE;border:1px solid #FFCDD2;border-radius:10px;padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:13px;color:#C62828;flex-wrap:wrap}
.alert-banner strong{font-weight:700}
.days-left{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;white-space:nowrap;flex-shrink:0}
.days-ok{background:#E8F5E9;color:#2E7D32}
.days-warn{background:#FFF8E1;color:#E65100}
.days-danger{background:#FFEBEE;color:#C62828}
.fav-btn{font-size:14px;cursor:pointer;padding:2px 4px;background:none;border:none;flex-shrink:0;transition:all .15s;line-height:1}
.fav-btn.on{filter:none}
.fav-btn.off{filter:grayscale(100%) brightness(1.8);opacity:.4}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:13px;color:#555;cursor:pointer}
.chip.on{background:#111;color:#fff;border-color:#111}
.qchips{display:none}
.inv-cards{display:none}
.icard{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.icard .nm{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.icard .sp{font-size:12px;color:#778;margin-top:2px}
.icard .big{font-size:24px;font-weight:700;line-height:1;text-align:center}
.icard .big small{display:block;font-size:10px;color:#99a;font-weight:400;margin-top:4px}
.dayhd{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#556;background:#f4f6f8;padding:7px 10px;border-radius:7px;margin:12px 0 2px}
.dayhd:first-child{margin-top:0}
@media(max-width:700px){
  .qchips{display:flex}
  .tbl-wrap.inv-tbl{display:none}
  .inv-cards{display:block}
  .col-box{overflow:visible;display:block}
  .col-body{flex:none}
  .col-body{max-height:none;overflow:visible}
  .pbuy{display:none}
  .action-feed{min-width:0;padding:3px 4px;font-size:10px}
  .prow{gap:6px;padding:10px 8px}
  .edit-sm{padding:4px 2px}
  .scval{width:40px;font-size:17px}
  .scbtn{width:36px;height:36px;font-size:19px}
  .hist-row{gap:8px}
  .quick-cols{grid-template-columns:1fr;height:auto}
  .cards{grid-template-columns:1fr 1fr}
  .dash-grid{grid-template-columns:1fr}
  .edit-sm{display:inline-block}
}
/*topfix*/@media (hover:none) and (pointer:coarse){.app{padding-top:calc(env(safe-area-inset-top,0px) + 36px)}}
</style>
</head>
<body>

<!-- 메인 앱 -->
<div id="main-app">
<div class="app">

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:8px">
  <h1>재고 관리</h1>
  <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
    <button class="notif-btn" id="notif-btn" onclick="requestNotif()">🔔 알림 허용</button>
    <div class="user-badge">
      <span id="user-name-badge">대표</span>
    </div>
    <div class="sync-badge" id="sync-status">
      <div class="spinner" style="width:12px;height:12px;border-width:1.5px"></div> 연결 중...
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab on" onclick="goTab('quick',this)">빠른 재고</button>
  <button class="tab" onclick="goTab('inv',this)">재고 현황</button>
  <button class="tab" onclick="goTab('hist',this)">거래 내역</button>
  <button class="tab" onclick="goTab('dash',this)">통계</button>
</div>

<!-- 빠른재고 -->
<div id="s-quick" class="sec on">
  <div id="alert-banner" style="display:none" class="alert-banner"></div>
  <div class="topbar">
    <input type="text" id="q-search" placeholder="부품명·규격 검색..." style="width:170px" oninput="renderQuick()">
    <select id="q-st" onchange="renderQuick()">
      <option value="">전체 상태</option>
      <option value="ok">정상</option><option value="low">부족</option><option value="out">재고없음</option>
    </select>
    <button class="btn btn-p" onclick="openAdd()" style="margin-left:auto">+ 부품 추가</button>
  </div>
  <div class="chips qchips" id="q-chips"></div>
  <div class="quick-cols">
    <div class="col-box">
      <div class="col-hd" style="color:#6B21A8">🔵 선반용 <span id="lathe-count" style="color:#aaa;font-weight:400;margin-left:4px"></span></div>
      <div class="col-body" id="col-lathe"></div>
    </div>
    <div class="col-box">
      <div class="col-hd" style="color:#B45309">🟠 밀링용 <span id="mill-count" style="color:#aaa;font-weight:400;margin-left:4px"></span></div>
      <div class="col-body" id="col-mill"></div>
    </div>
    <div class="col-box">
      <div class="col-hd" style="color:#555">📦 기타 <span id="other-count" style="color:#aaa;font-weight:400;margin-left:4px"></span></div>
      <div class="col-body" id="col-other"></div>
    </div>
  </div>
</div>

<!-- 재고현황 -->
<div id="s-inv" class="sec">
  <div class="topbar">
    <input type="text" id="i-search" placeholder="부품명·규격 검색..." style="width:160px" oninput="renderInv()">
    <select id="i-cat" onchange="renderInv()"><option value="">전체 카테고리</option></select>
    <select id="i-st" onchange="renderInv()">
      <option value="">전체 상태</option><option value="ok">정상</option><option value="low">부족</option><option value="out">재고없음</option><option value="ondemand">주문형</option>
    </select>
    <select id="i-sort" onchange="renderInv()"><option value="">이름순</option><option value="stock">재고 적은순</option></select>
    <button class="btn btn-p" onclick="openAdd()" style="margin-left:auto">+ 부품 추가</button>
  </div>
  <div class="chips" id="i-chips"></div>
  <div class="inv-cards" id="inv-cards"></div>
  <div class="tbl-wrap inv-tbl">
    <table>
      <thead><tr>
        <th>부품명</th><th>카테고리</th>
        <th style="text-align:right">재고</th><th style="text-align:right">최소</th>
        <th style="text-align:right">매입가</th>
        <th style="text-align:center">상태</th><th></th>
      </tr></thead>
      <tbody id="inv-body"></tbody>
    </table>
  </div>
</div>

<!-- 거래내역 -->
<div id="s-hist" class="sec">
  <div class="topbar">
    <select id="h-type" onchange="renderHist()"><option value="">전체</option><option value="sale">판매</option><option value="in">입고</option></select>
    <select id="h-mon" onchange="renderHist()"><option value="">전체 기간</option></select>
    <select id="h-part" onchange="renderHist()"><option value="">전체 부품</option></select>
  </div>
  <div class="card"><div id="hist-list"><div class="empty">불러오는 중...</div></div></div>
</div>

<!-- 통계 -->
<div id="s-dash" class="sec">
  <div class="topbar" style="margin-bottom:12px">
    <select id="dash-mon" onchange="renderDash()" style="font-size:14px;padding:8px 10px"><option value="">이번달</option></select>
    <span id="dash-mon-label" style="font-size:12px;color:#888"></span>
  </div>
  <div class="cards" id="d-metrics"></div>
  <div class="card">
    <div class="card-hd" id="trend-title" style="margin-bottom:6px">월별 판매 흐름</div>
    <div id="d-flow-sum" style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;font-size:12px;color:#667"></div>
    <div id="d-flow"></div>
    <div style="font-size:11px;color:#99a;margin-top:8px">막대를 누르면 그 달의 순위를 볼 수 있어요</div>
  </div>
  <div class="dash-grid">
    <div class="card"><div class="card-hd">재고 확인 필요</div><div id="d-low"></div></div>
    <div class="card"><div class="card-hd" id="d-top-title">이번달 판매 TOP</div><div id="d-top"></div></div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="card-hd" style="margin-bottom:0" id="d-annual-title">연간 판매 순위</div>
      <select id="annual-year" onchange="renderDash()" style="font-size:12px;padding:6px 8px"></select>
    </div>
    <div id="d-annual"></div>
  </div>
</div>

</div><!-- /.app -->
</div><!-- /#main-app -->

<!-- 부품 추가/수정 모달 -->
<div class="overlay" id="modal-wrap">
<div class="modal">
  <div class="modal-hd" id="m-title">부품 추가</div>
  <div class="mform">
    <input type="hidden" id="m-id">
    <div class="fg"><label>부품명</label><input id="m-name" placeholder="예: 6205 볼베어링"></div>
    <div class="fg"><label>카테고리</label><select id="m-cat"></select></div>
    <div class="fg"><label>규격·메모 (선택)</label><input id="m-spec" placeholder="예: HL460용 신형 / 25×52×15mm"></div>
    <div class="g2">
      <div class="fg"><label>현재 재고 (개)</label><input type="number" id="m-stock" value="0" min="0"></div>
      <div class="fg"><label>최소 재고 (경고 기준)</label><input type="number" id="m-min" value="5" min="0"></div>
    </div>
    <div class="fg"><label>매입가 (원)</label>
      <input type="text" id="m-buy" value="0" inputmode="numeric" oninput="fmtInput(this)" style="text-align:right">
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eee;margin-top:4px">
      <input type="checkbox" id="m-ondemand" style="width:16px;height:16px;cursor:pointer">
      <label for="m-ondemand" style="font-size:13px;color:#555;cursor:pointer">주문형 부품 (재고 부족 표시 안 함)</label>
    </div>
    <div class="fg">
      <label>부품 사진 (선택)</label>
      <div id="photo-preview" style="display:none;margin-bottom:6px">
        <img id="photo-img" style="width:100%;max-height:150px;object-fit:contain;border-radius:8px;border:1px solid #eee">
        <button onclick="removePhoto()" style="font-size:11px;color:#c0392b;background:none;border:none;cursor:pointer;margin-top:4px">사진 삭제</button>
      </div>
      <input type="file" id="m-photo" accept="image/*" onchange="previewPhoto(this)" style="font-size:12px;padding:4px">
    </div>
  </div>
  <div class="modal-ft">
    <button class="btn" onclick="closeModal()">취소</button>
    <button class="btn btn-p" id="save-btn" onclick="savePart()">저장</button>
  </div>
</div>
</div>

<!-- 확인 팝업 -->
<div class="overlay" id="confirm-wrap">
<div class="confirm-modal">
  <div class="confirm-title" id="confirm-title"></div>
  <div class="confirm-msg" id="confirm-msg"></div>
  <div class="confirm-btns">
    <button class="btn" onclick="confirmCancel()">취소</button>
    <button class="btn btn-p" id="confirm-ok-btn" onclick="confirmOk()">확인</button>
  </div>
</div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {
  getFirestore, collection, doc,
  onSnapshot, addDoc, updateDoc, deleteDoc, getDocs, getDoc, setDoc,
  serverTimestamp, query, orderBy
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const notifOn = () => Notification.permission==='granted' && localStorage.getItem('notifOff')!=='1';
const updateNotifBtn = () => {
  const b=document.getElementById('notif-btn'); if(!b||!('Notification' in window)) return;
  if(Notification.permission!=='granted'){ b.textContent='🔔 알림 허용'; b.style.color=''; }
  else if(localStorage.getItem('notifOff')==='1'){ b.textContent='🔕 알림 꺼짐'; b.style.color='#888'; }
  else { b.textContent='🔔 알림 ON'; b.style.color='#2E7D32'; }
};
window.requestNotif = async () => {
  if(!('Notification' in window)){ alert('이 브라우저는 알림을 지원하지 않아요.'); return; }
  if(Notification.permission==='granted'){
    const off = localStorage.getItem('notifOff')==='1';
    if(off) localStorage.removeItem('notifOff'); else localStorage.setItem('notifOff','1');
    updateNotifBtn(); showToast(off?'새로 부족해질 때만 알려드려요':'알림을 껐어요'); return;
  }
  const perm = await Notification.requestPermission();
  updateNotifBtn();
  showToast(perm==='granted'?'새로 부족해질 때만 알려드려요':'브라우저 설정에서 알림을 허용해 주세요.');
};

// 새로 나빠졌을 때만 알림 (앱을 다시 켜도 반복 안 함). 상태는 기기에 저장
const RANK={ok:0,low:1,out:2};
const checkAndNotify = () => {
  let prev={}; try{ prev=JSON.parse(localStorage.getItem('stockState')||'null'); }catch(e){}
  const first = !prev; prev = prev||{};
  const next={}, worse=[];
  parts.forEach(p=>{
    if(p.ondemand) return;
    const s=stOf(p); next[p._id]=s;
    if(!first && prev[p._id]!==undefined && RANK[s]>RANK[prev[p._id]]) worse.push(p);
  });
  localStorage.setItem('stockState',JSON.stringify(next));
  if(!worse.length || !notifOn()) return;
  const nm=p=>p.name+(p.spec?' '+p.spec:'');
  if(worse.length===1){ const p=worse[0]; new Notification(stOf(p)==='out'?'재고 없음':'재고 부족',{body:nm(p)+' 현재 '+p.stock+'개'}); }
  else new Notification('재고 확인 필요 '+worse.length+'종',{body:worse.slice(0,3).map(nm).join(', ')+(worse.length>3?' 외':'')});
};

// ── Firestore 리스너 ──
let unsubParts=null, unsubHist=null;
async function startListeners(){
  if(unsubParts) unsubParts();
  if(unsubHist)  unsubHist();

  // 즐겨찾기는 백그라운드로 로드
  loadFavs();

  // 실시간 리스너
  unsubParts = onSnapshot(
    query(collection(db,'parts'), orderBy('name')),
    snap => {
      parts = snap.docs.map(d=>({...d.data(), _id: d.id}));
      partsLoaded = true;
      setSyncStatus(true);
      checkAndNotify();
      fillCatSelects();
      renderQuick(); renderInv();
      const activeTab = document.querySelector('.tab.on')?.textContent?.trim();
      if(activeTab==='통계') renderDash();
    },
    err => { console.error(err); setSyncStatus(false); }
  );

  unsubHist = onSnapshot(
    query(collection(db,'history'), orderBy('date','desc')),
    snap => {
      hist = snap.docs.map(d=>({...d.data(), _id: d.id}))
        .sort((a,b)=>{
          if(a.date!==b.date) return a.date<b.date?1:-1;
          const ta=a.ts?.seconds||0, tb=b.ts?.seconds||0;
          return tb-ta;
        });
      const activeTab = document.querySelector('.tab.on')?.textContent?.trim();
      if(activeTab==='거래 내역') renderHist();
      if(activeTab==='통계') renderDash();
    }
  );
}

window.setStock = async (id, val) => {
  const p=parts.find(x=>x._id===id); if(!p) return;
  const v=Math.max(0,parseInt(val)||0);
  const diff=v-p.stock; if(diff===0) return;
  const userName = USER_NAMES[currentUser?.email] || currentUser?.email || '대표';
  await updateDoc(doc(db,'parts',id),{stock:v});
  await addDoc(collection(db,'history'),{
    type:diff<0?'sale':'in', date:today(), ts:serverTimestamp(), pid:id, pname:p.name, pspec:p.spec||'',
    qty:Math.abs(diff), price:p.buy, user:userName
  });
};

// 평균 소진 속도 계산 (최근 3개월 판매 기반)
const getAvgMonthly = pid => {
  const d=new Date(); d.setDate(1);
  const months=[];
  for(let i=0;i<3;i++){
    const dd=new Date(d); dd.setMonth(dd.getMonth()-i);
    months.push(`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}`);
  }
  const total=hist.filter(h=>h.type==='sale'&&h.pid===pid&&months.includes(ymKey(h.date))).reduce((s,h)=>s+h.qty,0);
  return total/3;
};

const getDaysLeft = (stock, avgPerMonth) => {
  if(avgPerMonth<=0) return null;
  return Math.round(stock/(avgPerMonth/30));
};

const renderAlertBanner = () => {
  const urgent = parts.filter(p=>stOf(p)!=='ok' && !p.ondemand);
  const banner = document.getElementById('alert-banner');
  if(!banner) return;
  if(!urgent.length){ banner.style.display='none'; return; }
  banner.style.display='flex';
  banner.innerHTML=`<span>⚠️</span><strong>주문 필요 ${urgent.length}종</strong><span style="color:#888;font-size:12px">→</span>`
    +urgent.map(p=>`<span onclick="jumpPart('${p._id}')" style="cursor:pointer;background:#fff;border:1px solid #FFCDD2;border-radius:6px;padding:4px 10px;font-size:12px">${p.name}${p.spec?' '+p.spec:''} (${p.stock}개)</span>`).join('');
};

const makeRow = p => {
  const s = stOf(p);
  const isFav = favorites.includes(p._id);
  const avg = getAvgMonthly(p._id);
  const days = p.ondemand ? null : getDaysLeft(p.stock, avg);
  let daysHtml='';
  if(days!==null){
    const cls=days<=7?'days-danger':days<=30?'days-warn':'days-ok';
    daysHtml=`<span class="days-left ${cls}">약 ${days}일치</span>`;
  }
  return `<div class="prow ${s==='ondemand'?'':s}">
    <button class="fav-btn ${isFav?'on':'off'}" onclick="toggleFav('${p._id}')" title="즐겨찾기">⭐</button>
    <div class="pinfo" onclick="showDetail('${p._id}')" style="cursor:pointer">
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span class="pname">${p.name}</span>${badgeSt(s)}${daysHtml}
      </div>
      <div class="pmeta">${p.spec?p.spec:''}<span class="pbuy">${p.spec?' · ':''}매입 ${p.buy.toLocaleString()}원</span>${!p.ondemand&&avg>0?` · 월평균 ${avg.toFixed(1)}개`:''}${p.photoURL?' 📷':''}</div>
    </div>
    <div id="feed-${p._id}" class="action-feed"></div>
    <div class="stock-ctrl">
      <button class="scbtn" onclick="sell('${p._id}',1)">−</button>
      <input class="scval" type="number" value="${p.stock}" min="0"
        onchange="setStock('${p._id}',this.value)"
        onkeydown="if(event.key==='Enter')this.blur()">
      <button class="scbtn" onclick="restock('${p._id}',1)">+</button>
    </div>
    <span class="edit-sm" onclick="openEdit('${p._id}')">수정</span>

let quickCat='선반용';
window.setQuickCat = c => { quickCat=c; renderQuick(); };
window.jumpPart = id => { const p=parts.find(x=>x._id===id); if(!p) return; document.getElementById('q-search').value=p.name; renderQuick(); window.scrollTo({top:0,behavior:'smooth'}); };
const renderQuick = () => {
  const q  = (document.getElementById('q-search')?.value||'').toLowerCase();
  const st = document.getElementById('q-st')?.value||'';
  // 즐겨찾기 → 가나다 순 (고정, 재고 변동에 영향받지 않음)
  const sortFn = (a,b)=>{
    // 즐겨찾기 우선
    const fa=favorites.includes(a._id)?0:1;
    const fb=favorites.includes(b._id)?0:1;
    if(fa!==fb) return fa-fb;
    // 부품명 기준으로 먼저 묶기
    const nameComp = a.name.localeCompare(b.name,'ko');
    if(nameComp!==0) return nameComp;
    // 같은 부품명이면 spec 숫자 오름차순
    const getNum = p => {
      const combined = (p.spec||'');
      const nums = combined.match(/\d+/g);
      return nums ? parseInt(nums[0]) : 0;
    };
    const numA = getNum(a);
    const numB = getNum(b);
    if(numA!==numB) return numA-numB;
    // 신형 > 구형
    const newA = (a.spec||'').includes('신형')?0:(a.spec||'').includes('구형')?1:2;
    const newB = (b.spec||'').includes('신형')?0:(b.spec||'').includes('구형')?1:2;
    return newA-newB;
  };
  const filter = p=>(!q||(p.name+' '+(p.spec||'')).toLowerCase().includes(q))&&(!st||stOf(p)===st);

  const mobile = window.matchMedia('(max-width:700px)').matches;
  const showAll = !mobile || !!q;
  const qcnt = c=>parts.filter(p=>p.cat===c&&filter(p)).length;
  document.getElementById('q-chips').innerHTML = CATS.map(c=>`<button class="chip ${(showAll?'':quickCat)===c?'on':''}" onclick="setQuickCat('${c}')">${c} ${qcnt(c)}</button>`).join('');
  [['선반용','col-lathe'],['밀링용','col-mill'],['기타','col-other']].forEach(([c,id])=>{ const b=document.getElementById(id).closest('.col-box'); b.style.display=(showAll||quickCat===c)?'':'none'; });
  const lathe = parts.filter(p=>p.cat==='선반용'&&filter(p)).sort(sortFn);
  const mill  = parts.filter(p=>p.cat==='밀링용'&&filter(p)).sort(sortFn);
  const other = parts.filter(p=>p.cat==='기타'&&filter(p)).sort(sortFn);

  renderAlertBanner();
  document.getElementById('lathe-count').textContent=`${lathe.length}종`;
  document.getElementById('mill-count').textContent=`${mill.length}종`;
  document.getElementById('other-count').textContent=`${other.length}종`;
  document.getElementById('col-lathe').innerHTML=lathe.length?lathe.map(makeRow).join(''):'<div class="empty" style="padding:1rem">부품 없음</div>';
  document.getElementById('col-mill').innerHTML=mill.length?mill.map(makeRow).join(''):'<div class="empty" style="padding:1rem">부품 없음</div>';
  document.getElementById('col-other').innerHTML=other.length?other.map(makeRow).join(''):'<div class="empty" style="padding:1rem">부품 없음</div>';
};
window.renderQuick = renderQuick;

let histLimit=30, histSig='';
window.addEventListener('resize',()=>{});
const renderHist = () => {
  const ht=document.getElementById('h-type').value;
  const hm=document.getElementById('h-mon').value;
  const hp=document.getElementById('h-part').value;
  const list=hist.filter(h=>(!ht||h.type===ht)&&(!hm||ymKey(h.date)===hm)&&(!hp||h.pid===hp));
  const sig=ht+'|'+hm+'|'+hp; if(sig!==histSig){histSig=sig;histLimit=30;}
  const shown=list.slice(0,histLimit);
  const byDay={}; shown.forEach(h=>{(byDay[h.date]=byDay[h.date]||[]).push(h);});
  const wd=['일','월','화','수','목','금','토'];
  document.getElementById('hist-list').innerHTML=shown.length?Object.keys(byDay).map(day=>{
    const rows=byDay[day]; const sq=rows.filter(h=>h.type==='sale').reduce((s,h)=>s+h.qty,0), iq=rows.filter(h=>h.type!=='sale').reduce((s,h)=>s+h.qty,0);
    const dt=new Date(day+'T00:00:00');
    return `<div class="dayhd"><span>${dt.getMonth()+1}월 ${dt.getDate()}일 (${wd[dt.getDay()]})</span><span>${sq?'판매 '+sq+'개':''}${sq&&iq?' · ':''}${iq?'입고 '+iq+'개':''}</span></div>`+rows.map(h=>`
    <div class="hist-row">
      <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1">
        <span class="badge ${h.type==='sale'?'b-blue':'b-ok'}" style="flex-shrink:0;white-space:nowrap">${h.type==='sale'?'판매':'입고'}</span>
        <div style="min-width:0">
          <div style="overflow-wrap:anywhere">${esc(shortName(h.pname))}${h.pspec?` <span style="font-size:11px;color:#888">(${esc(shortName(h.pspec))})</span>`:''} <span style="font-size:11px;color:#aaa;margin-left:4px">${esc(h.user||'')}</span></div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
        <div style="font-weight:600;white-space:nowrap">${h.type==='sale'?'−':'+'}${h.qty}개</div>
        <button onclick="deleteHist('${h._id}')" style="font-size:11px;color:#aaa;background:none;border:none;cursor:pointer;padding:6px;white-space:nowrap">삭제</button>
      </div>
    </div>`).join('');}).join('')+(list.length>histLimit?`<button class="btn" style="width:100%;margin-top:12px;padding:12px" onclick="histLimit+=30;renderHist()">더 보기 (${list.length-histLimit}건 남음)</button>`:''):'<div class="empty">내역 없음</div>';
  const months=[...new Set(hist.map(h=>ymKey(h.date)))].sort().reverse();
  const msel=document.getElementById('h-mon');const cv=msel.value;
  msel.innerHTML='<option value="">전체 기간</option>'+months.map(m=>`<option value="${m}"${m===cv?' selected':''}>${m}</option>`).join('');
  const psel=document.getElementById('h-part');const pv=psel.value;
  psel.innerHTML='<option value="">전체 부품</option>'+parts.map(p=>`<option value="${p._id}"${p._id===pv?' selected':''}>${p.name}</option>`).join('');
};
window.renderHist = renderHist;
Object.defineProperty(window,"histLimit",{get:()=>histLimit,set:v=>{histLimit=v;}});

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shortName = s => String(s).startsWith('공장 직송')?'공장 직송':String(s).replace(/\s*\(공장 직송[^)]*(\([^)]*\)[^)]*)*\)/,'').trim();
const renderDash = () => {
  const allSales = hist.filter(h=>h.type==='sale');
  const monSel=document.getElementById('dash-mon');
  const curMon=monSel.value;
  const allMonths=[...new Set(allSales.map(h=>ymKey(h.date)))].sort().reverse();
  monSel.innerHTML='<option value="">이번달</option>'+allMonths.map(m=>`<option value="${m}"${m===curMon?' selected':''}>${m}</option>`).join('');
  const selectedMon = monSel.value || thisMonth();
  const label = monSel.value ? monSel.value.replace('-','년 ')+'월' : '이번달';
  const ms = allSales.filter(h=>ymKey(h.date)===selectedMon);
  const totalQ=ms.reduce((s,h)=>s+h.qty,0);
  const need=parts.filter(p=>stOf(p)!=='ok'&&!p.ondemand);
  document.getElementById('d-top-title').textContent=`${label} 판매 순위`;
  document.getElementById('d-metrics').innerHTML=`
    <div class="mcard"><div class="mcard-l">${label} 판매수량</div><div class="mcard-v" style="color:#185dd4">${totalQ}개</div></div>
    <div class="mcard"><div class="mcard-l">판매된 품목</div><div class="mcard-v">${new Set(ms.map(h=>h.pid)).size}종</div></div>
    <div class="mcard"><div class="mcard-l">관리 중인 부품</div><div class="mcard-v">${parts.length}종</div></div>
    <div class="mcard"><div class="mcard-l">재고 확인 필요</div><div class="mcard-v" style="color:${need.length?'#bc5424':'#2E7D32'}">${need.length}종</div></div>`;

  // 월별 흐름 (HTML 막대, 연도 선택은 아래 연간 순위와 연동)
  const yrSel=document.getElementById('annual-year');
  const years=[...new Set(allSales.map(h=>h.date.slice(0,4)))].sort().reverse();
  const nowY=String(new Date().getFullYear());
  const yr=yrSel.value||(years.includes(nowY)?nowY:years[0]||nowY);
  yrSel.innerHTML=years.map(y=>`<option value="${y}"${y===yr?' selected':''}>${y}년</option>`).join('');
  const mset=Array.from({length:12},(_,i)=>`${yr}-${String(i+1).padStart(2,'0')}`);
  const vals=mset.map(m=>allSales.filter(h=>ymKey(h.date)===m).reduce((s,h)=>s+h.qty,0));
  const nowM=thisMonth();
  const done=vals.filter((v,i)=>mset[i]<nowM&&v>0);
  const avg=done.length?Math.round(done.reduce((a,b)=>a+b,0)/done.length):0;
  const maxV=Math.max(...vals,1), best=vals.indexOf(Math.max(...vals));
  document.getElementById('trend-title').textContent=`${yr}년 월별 판매 흐름 (개)`;
  document.getElementById('d-flow-sum').innerHTML=`<span>월평균 <b style="color:#111">${avg}개</b></span><span>최고 <b style="color:#185dd4">${best+1}월 ${vals[best]}개</b></span><span>연 합계 <b style="color:#111">${vals.reduce((a,b)=>a+b,0)}개</b></span>`;
  document.getElementById('d-flow').innerHTML=`<div style="position:relative">${avg?`<div style="position:absolute;left:0;right:0;bottom:${24+avg/maxV*140}px;border-top:1px dashed #b9c3d3"></div>`:''}<div style="display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px;align-items:end;height:190px">`+
    vals.map((v,i)=>{const sel=mset[i]===selectedMon,future=mset[i]>nowM;return `<div onclick="pickMonth('${mset[i]}')" style="cursor:pointer;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%">
      <div style="font-size:10px;color:#667;height:16px">${v||''}</div>
      <div style="height:${v?Math.max(4,v/maxV*140):2}px;background:${sel?'#185dd4':future?'#eef1f5':'#c9d7ec'};border-radius:4px 4px 0 0"></div>
      <div style="font-size:10px;margin-top:6px;height:18px;color:${sel?'#185dd4':'#7a8698'};font-weight:${sel?700:400}">${i+1}월</div></div>`}).join('')+`</div></div>
    <div style="font-size:11px;color:#778;margin-top:4px">점선 = 월평균(지난 달까지)${yr===nowY?' · 이번 달은 진행 중':''}</div>`;

  // 재고 확인 필요 (규격 포함)
  need.sort((a,b)=>a.stock-b.stock);
  document.getElementById('d-low').innerHTML=need.length?need.map(p=>`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eef1f4">
      <div style="min-width:0"><div style="font-size:14px;font-weight:600;overflow-wrap:anywhere">${esc(p.name)}</div><div style="font-size:12px;color:#778">${p.spec?esc(p.spec)+' · ':''}현재 ${p.stock}개</div></div>
      ${badgeSt(stOf(p))}</div>`).join(''):'<div class="empty">재고 부족 없음</div>';

  // 월 판매 순위
  const map={};ms.forEach(h=>{
    const key=h.pid+(h.pspec||'');
    if(!map[key]) map[key]={n:shortName(h.pname)+(h.pspec?` (${shortName(h.pspec)})`:''),q:0};
    map[key].q+=h.qty;
  });
  const top=Object.values(map).sort((a,b)=>b.q-a.q).slice(0,8);const mx=top[0]?.q||1;
  document.getElementById('d-top').innerHTML=top.length?top.map((x,i)=>`
    <div style="display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #eef1f4">
      <span style="font-size:12px;color:#8490a1;width:16px;flex-shrink:0;padding-top:1px">${i+1}</span>
      <div style="flex:1;min-width:0"><div style="font-size:14px;overflow-wrap:anywhere">${esc(x.n)}</div>
      <div class="bar-o" style="height:5px"><div class="bar-i" style="height:5px;width:${Math.round(x.q/mx*100)}%;background:#3676de"></div></div></div>
      <b style="font-size:15px;white-space:nowrap">${x.q}개</b></div>`).join(''):'<div class="empty">판매 없음</div>';

  // 연간 순위 (상위 10 + 더보기)
  document.getElementById('d-annual-title').textContent=`${yr}년 판매 순위`;
  const amap={};
  allSales.filter(h=>h.date.startsWith(yr)).forEach(h=>{
    const key=h.pid+(h.pspec||'');
    if(!amap[key]){const _p=parts.find(p=>p._id===h.pid);amap[key]={name:shortName(h.pname)+(h.pspec?` (${shortName(h.pspec)})`:''),qty:0,od:_p?.ondemand||false,stock:_p?.ondemand?null:(_p?.stock??null)};}
    amap[key].qty+=h.qty;
  });
  const arr=Object.values(amap).sort((a,b)=>b.qty-a.qty), aMax=arr[0]?.qty||1;
  const rowH=(x,i)=>`<div style="padding:10px 0;border-bottom:1px solid #eef1f4">
    <div style="display:flex;gap:8px;align-items:flex-start"><span style="font-size:12px;color:#8490a1;width:20px;flex-shrink:0">${i+1}</span>
    <div style="flex:1;min-width:0;font-size:14px;overflow-wrap:anywhere">${esc(x.name)}${x.od?' <span style="font-size:10px;background:#F3E8FF;color:#6B21A8;padding:1px 6px;border-radius:3px">주문형</span>':''}${!x.od&&x.stock!==null?` <span style="font-size:11px;color:#888;background:#f3f4f6;border-radius:3px;padding:1px 6px">재고 ${x.stock}</span>`:''}</div>
    <b style="font-size:15px;white-space:nowrap">${x.qty}개</b></div>
    <div class="bar-o" style="height:5px;margin-left:28px"><div class="bar-i" style="height:5px;width:${Math.round(x.qty/aMax*100)}%;background:${x.od?'#9F7AEA':'#3676de'}"></div></div></div>`;
  document.getElementById('d-annual').innerHTML=arr.length?arr.slice(0,10).map(rowH).join('')+(arr.length>10?`<details><summary style="cursor:pointer;color:#185dd4;font-size:13px;padding:12px 0">나머지 ${arr.length-10}종 더 보기</summary>${arr.slice(10).map((x,i)=>rowH(x,i+10)).join('')}</details>`:''):'<div class="empty">판매 내역 없음</div>';
};
window.pickMonth = m => { const s=document.getElementById('dash-mon'); if(![...s.options].some(o=>o.value===m)){ showToast('이 달은 판매 내역이 없어요'); return; } s.value=(m===thisMonth()?'':m); renderDash(); };
window.renderDash = renderDash;

const fillCatSelects = () => {
  const opts=CATS.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('m-cat').innerHTML=opts;
  const el=document.getElementById('i-cat');const cur=el.value;
  el.innerHTML='<option value="">전체 카테고리</option>'+CATS.map(c=>`<option${c===cur?' selected':''}>${c}</option>`).join('');
};
window.fillCatSelects = fillCatSelects;

window.goTab = (id, btn) => {
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('s-'+id).classList.add('on');
  btn.classList.add('on');
  if(id==='quick'){fillCatSelects();renderQuick();}
  else if(id==='inv'){fillCatSelects();renderInv();}
  else if(id==='hist') renderHist();
  else if(id==='dash') renderDash();
};

window.openAdd = () => {
  document.getElementById('m-title').textContent='부품 추가';
  document.getElementById('m-id').value='';
  ['m-name','m-spec'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('m-stock').value=0;
  document.getElementById('m-min').value=0;
  document.getElementById('m-buy').value='0';
  document.getElementById('m-ondemand').checked=false;
  document.getElementById('m-photo').value='';
  document.getElementById('photo-preview').style.display='none';
  currentPhotoFile=null; currentPhotoURL=null;
  fillCatSelects();
  document.getElementById('modal-wrap').classList.add('open');
};

window.openEdit = id => {
  const p=parts.find(x=>x._id===id);if(!p)return;
  document.getElementById('m-title').textContent='부품 수정';
  document.getElementById('m-id').value=id;
  document.getElementById('m-name').value=p.name;
  document.getElementById('m-spec').value=p.spec||'';
  document.getElementById('m-stock').value=p.stock;
  document.getElementById('m-min').value=p.min;
  document.getElementById('m-buy').value=p.buy.toLocaleString();
  document.getElementById('m-ondemand').checked=p.ondemand||false;
  document.getElementById('m-photo').value='';
  currentPhotoFile=null;
  currentPhotoURL=p.photoURL||null;
  if(p.photoURL){
    document.getElementById('photo-img').src=p.photoURL;
    document.getElementById('photo-preview').style.display='block';
  } else {
    document.getElementById('photo-preview').style.display='none';
  }
  fillCatSelects();
  document.getElementById('m-cat').value=p.cat;
  document.getElementById('modal-wrap').classList.add('open');
};

window.closeModal = () => {
  document.getElementById('modal-wrap').classList.remove('open');
  currentPhotoFile=null; currentPhotoURL=null;
};

window.showDetail = id => {
  const p = parts.find(x=>x._id===id); if(!p) return;
  const s = stOf(p);
  const avg = getAvgMonthly(p._id);
  const days = p.ondemand ? null : getDaysLeft(p.stock, avg);
  const ov = document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML=`
    <div style="background:#fff;border-radius:16px;padding:24px;width:340px;max-width:92vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <div style="font-size:16px;font-weight:700">${p.name}</div>
        <button onclick="this.closest('.fixed-ov').remove()" style="background:none;border:none;font-size:20px;color:#aaa;cursor:pointer;line-height:1">×</button>
      </div>
      ${p.photoURL?`<img src="${p.photoURL}" style="width:100%;max-height:200px;object-fit:contain;border-radius:10px;border:1px solid #eee;margin-bottom:14px">` : ''}
      <div style="display:flex;flex-direction:column;gap:10px;font-size:13px">
        <div style="display:flex;justify-content:space-between"><span style="color:#888">상태</span>${badgeSt(s)}</div>
        <div style="display:flex;justify-content:space-between"><span style="color:#888">카테고리</span><span>${p.cat}</span></div>
        ${p.spec?`<div style="display:flex;justify-content:space-between"><span style="color:#888">규격</span><span>${p.spec}</span></div>`:''}
        <div style="display:flex;justify-content:space-between"><span style="color:#888">현재 재고</span><span style="font-weight:700">${p.stock}개</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:#888">최소 재고</span><span>${p.min}개</span></div>
        <div style="display:flex;justify-content:space-between"><span style="color:#888">매입가</span><span>${p.buy.toLocaleString()}원</span></div>
        ${avg>0&&!p.ondemand?`<div style="display:flex;justify-content:space-between"><span style="color:#888">월평균 판매</span><span>${avg.toFixed(1)}개</span></div>`:''}
        ${days!==null?`<div style="display:flex;justify-content:space-between"><span style="color:#888">예상 소진</span><span>약 ${days}일</span></div>`:''}
        ${p.ondemand?`<div style="color:#6B21A8;font-size:12px;background:#F3E8FF;padding:6px 10px;border-radius:6px">주문형 부품 — 재고 관리 제외</div>`:''}
      </div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="this.closest('.fixed-ov').remove();openEdit('${p._id}')" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;background:#fff;font-size:13px;cursor:pointer;font-weight:500">수정</button>
        <button onclick="this.closest('.fixed-ov').remove()" style="flex:1;padding:10px;border-radius:8px;border:none;background:#111;color:#fff;font-size:13px;cursor:pointer;font-weight:500">닫기</button>
      </div>
    </div>`;
  ov.classList.add('fixed-ov');
  ov.onclick = e => { if(e.target===ov) ov.remove(); };
  document.body.appendChild(ov);
};

window.showPhoto = url => {
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer';
  ov.innerHTML=`<img src="${url}" style="max-width:90vw;max-height:90vh;border-radius:8px">`;
  ov.onclick=()=>ov.remove();
  document.body.appendChild(ov);
};

window.savePart = async (force) => {
  const btn=document.getElementById('save-btn');
  if(force!==true && !document.getElementById('m-id').value){
    const nm=document.getElementById('m-name').value.trim().toLowerCase(), sp=document.getElementById('m-spec').value.trim().toLowerCase();
    if(nm && parts.some(p=>p.name.trim().toLowerCase()===nm && (p.spec||'').trim().toLowerCase()===sp)){
      showConfirm('이미 있는 부품','이름과 규격이 같은 부품이 이미 있어요.\n그래도 새로 추가할까요?','그래도 추가',()=>savePart(true)); return;
    }
  }
  btn.disabled=true; btn.textContent='저장 중...';
  const id=document.getElementById('m-id').value;
  const d={
    name: document.getElementById('m-name').value.trim(),
    cat:  document.getElementById('m-cat').value,
    spec: document.getElementById('m-spec').value.trim(),
    stock:parseInt(document.getElementById('m-stock').value)||0,
    min:  parseInt(document.getElementById('m-min').value)||0,
    buy:  parseFmt(document.getElementById('m-buy').value),
    ondemand: document.getElementById('m-ondemand').checked,
    sell: 0, updatedAt: serverTimestamp()
  };
  if(!d.name){alert('부품명을 입력하세요');btn.disabled=false;btn.textContent='저장';return;}
  try{
    // 사진 업로드
    if(currentPhotoFile){
      const storageRef = ref(storage, `parts/${Date.now()}_${currentPhotoFile.name}`);
      await uploadBytes(storageRef, currentPhotoFile);
      d.photoURL = await getDownloadURL(storageRef);
    } else if(currentPhotoURL){
      d.photoURL = currentPhotoURL;
    } else {
      d.photoURL = null;
    }
    if(id){ await updateDoc(doc(db,'parts',id),d); showToast('수정 완료!'); }
    else { d.createdAt=serverTimestamp(); await addDoc(collection(db,'parts'),d); showToast('부품 추가 완료!'); }
    closeModal();
  }catch(e){alert('오류: '+e.message);}
  btn.disabled=false; btn.textContent='저장';
};

window.deleteHist = id => {
  showConfirm('내역 삭제','이 거래 내역을 삭제할까요?','삭제', async()=>{
    await deleteDoc(doc(db,'history',id));
    showToast('내역 삭제 완료');
  });
};

window.delPart = id => {
  showConfirm('부품 삭제','이 부품을 삭제할까요?','삭제', async()=>{
    await deleteDoc(doc(db,'parts',id));
    showToast('삭제 완료');
  });
};

document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); confirmCancel(); } });
